name: Publicacion web controlada
# auto: deriva el candidato SOLO de evidencia verificable del main privado (CI de 4 trabajos verde,
#       artefacto producido por preparar-web-aprobada.yml en main, digest/SHA/procedencia) y publica
#       sin intervencion humana si esta estrictamente por delante de produccion.
# verify/publish/rollback: usan el manifiesto fijado releases/web.json (aprobado por CODEOWNERS).
# Cualquier cambio de este workflow, scripts o permisos sigue exigiendo revision de CODEOWNERS.
on:
  workflow_dispatch:
    inputs:
      operacion:
        type: choice
        options: [auto, verify, publish, rollback]
        default: auto
        required: true
      confirmar:
        description: Confirmo la publicacion o retorno del manifiesto fijado (no aplica a auto)
        type: boolean
        default: false
        required: true
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: production-web
  cancel-in-progress: false
jobs:
  web:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.operacion == 'auto' || inputs.operacion == 'verify' || inputs.confirmar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: web-production
    env:
      OPERATION: ${{ inputs.operacion || 'auto' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verificar aprobacion de release por CODEOWNERS
        if: env.OPERATION != 'auto'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-pr.mjs
      - name: Derivar candidato autorizado desde evidencia del main privado
        if: env.OPERATION == 'auto'
        env:
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_READER_TOKEN: ${{ secrets.SOURCE_READER_TOKEN }}
        run: node scripts/source.mjs discover
      - name: Verificar origen privado y cuatro trabajos CI
        env:
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_READER_TOKEN: ${{ secrets.SOURCE_READER_TOKEN }}
        run: node scripts/source.mjs verify
      - name: Conciliar el estado actual sin escrituras
        id: preflight
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          PUBLIC_ORIGINS: ${{ vars.PUBLIC_ORIGINS }}
          CF_WORKER_PUBLISH_TOKEN: ${{ secrets.CF_WORKER_PUBLISH_TOKEN }}
        run: node scripts/cloudflare.mjs preflight
      - name: Impedir retrocesos respecto de produccion
        if: env.OPERATION == 'auto' && steps.preflight.outputs.action == 'publish'
        env:
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_READER_TOKEN: ${{ secrets.SOURCE_READER_TOKEN }}
          PRODUCTION_SHA: ${{ steps.preflight.outputs.production_sha }}
        run: node scripts/source.mjs forward
      - name: Descargar artefacto privado sin ejecutar su codigo
        if: steps.preflight.outputs.action == 'publish'
        env:
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_READER_TOKEN: ${{ secrets.SOURCE_READER_TOKEN }}
        run: |
          node scripts/source.mjs download
          python scripts/extract.py
      - name: Publicar o retornar una sola vez
        if: env.OPERATION != 'verify' && steps.preflight.outputs.action != 'current'
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          PUBLIC_ORIGINS: ${{ vars.PUBLIC_ORIGINS }}
          CF_WORKER_PUBLISH_TOKEN: ${{ secrets.CF_WORKER_PUBLISH_TOKEN }}
        run: node scripts/cloudflare.mjs execute
